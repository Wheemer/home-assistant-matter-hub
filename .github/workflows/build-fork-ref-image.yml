name: Build Fork Ref Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: wheemer-testing-compat
        type: string
      version:
        description: "Version tag to build, e.g. 4.1.0-testing.26-wheemer.1"
        required: true
        type: string
      channel:
        description: "Docker channel tag"
        required: true
        default: testing
        type: choice
        options:
          - testing
          - alpha
          - latest

permissions:
  contents: read
  packages: write

jobs:
  package:
    name: Package app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Environment
        uses: ./.github/actions/setup-node

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version
        run: pnpm run release:version "${{ github.event.inputs.version }}"

      - name: Build package
        run: |
          APP_VERSION="${{ github.event.inputs.version }}" pnpm run build
          APP_VERSION="${{ github.event.inputs.version }}" pnpm run release:pack
        env:
          BASE_URL: /home-assistant-matter-hub

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: package.tgz
          path: apps/home-assistant-matter-hub/package.tgz

  prepare-docker:
    name: Prepare Docker
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.dockerfiles.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}
      - name: Find Dockerfiles
        id: dockerfiles
        uses: ./.github/actions/find-dockerfiles

  docker:
    name: Build Docker
    runs-on: ubuntu-24.04-arm
    needs: [package, prepare-docker]
    strategy:
      matrix:
        dockerfile: ${{ fromJSON(needs.prepare-docker.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Setup Docker
        uses: ./.github/actions/setup-docker

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download package artifact
        uses: actions/download-artifact@v7
        with:
          name: package.tgz
          path: apps/home-assistant-matter-hub/
          merge-multiple: true

      - name: Build and push Docker image
        uses: ./.github/actions/docker
        with:
          push: true
          channel: ${{ github.event.inputs.channel }}
          dockerfile: ${{ matrix.dockerfile }}
          package-version: ${{ github.event.inputs.version }}
